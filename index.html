<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CouchTaterz™" />
    <meta name="application-name" content="CouchTaterz™" />

    <!-- OpenGraph & Social Share Preview Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CouchTaterz™" />
    <meta property="og:title" content="CouchTaterz™ — Your AI-Powered TV Tracker & Household Queue" />
    <meta property="og:description" content="Never lose track of your shows again. Coordinate household queues across Netflix, HBO, Disney+, Apple TV+, and generate AI episode recaps." />
    <meta property="og:image" content="/api/og-card" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CouchTaterz™ — Your AI-Powered TV Tracker & Household Queue" />
    <meta name="twitter:description" content="Track progress across all streaming services, sync with family, and catch up with AI spoiler-free recaps." />
    <meta name="twitter:image" content="/api/og-card" />

    <title>CouchTaterz™ — AI TV Tracker & Household Queue</title>
    <script>
      // 1. Force unregister any legacy service workers and clear stale caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        }).catch(function() {});
      }

      // 2. Fallback error catcher for pre-React module loading issues
      window.addEventListener('error', function(e) {
        console.error('[Pre-React Error]', e);
        var root = document.getElementById('root');
        if (root && (!root.children.length || root.innerHTML.indexOf('Loading CouchTaterz') !== -1)) {
          root.innerHTML = '<div style="min-height: 100vh; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-sans-serif, system-ui, sans-serif; color: #cbd5e1; padding: 24px; text-align: center;">'
            + '<div style="max-width: 480px; width: 100%; background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">'
            + '<div style="font-size: 32px; margin-bottom: 12px;">🥔</div>'
            + '<div style="font-size: 18px; font-weight: 700; color: #f8fafc; margin-bottom: 8px;">Dashboard Synchronization</div>'
            + '<div style="font-size: 13px; color: #94a3b8; margin-bottom: 20px; line-height: 1.5;">' + (e.message || 'Connecting to CouchTaterz servers. Please refresh if this takes longer than a few seconds.') + '</div>'
            + '<div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">'
            + '<button onclick="window.location.reload()" style="background: #f59e0b; color: #020617; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 600; font-size: 13px; cursor: pointer;">Reload Dashboard</button>'
            + '<button onclick="localStorage.clear(); sessionStorage.clear(); window.location.href=window.location.pathname + \'?nocache=\' + Date.now()" style="background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 10px; padding: 10px 18px; font-weight: 500; font-size: 13px; cursor: pointer;">Clear Local Cache</button>'
            + '</div>'
            + '</div>'
            + '</div>';
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root">
      <div style="min-height: 100vh; background-color: #020617; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: ui-sans-serif, system-ui, sans-serif; color: #94a3b8; padding: 20px; text-align: center;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; border-radius: 50%; animation: ctat-spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-size: 18px; font-weight: 600; color: #f8fafc; margin-bottom: 6px;">Loading CouchTaterz™...</div>
        <div style="font-size: 13px; color: #64748b; max-width: 320px;">Synchronizing your watchlists and household queue</div>
        <style>
          @keyframes ctat-spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
